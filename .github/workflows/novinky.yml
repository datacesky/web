# Novinky z dat: jednou měsíčně stáhne čerstvá čísla z ČSÚ, Eurostatu a Světové banky (skripty/novinky.py)
# a pošle je jako návrh ke schválení (pull request). Na web se dostanou, až návrh schválíš (Merge).
# Ručně: záložka Actions → Novinky z dat → Run workflow. Už zveřejněné vydání se nepřepíše,
# druhé spuštění ve stejném měsíci připraví samostatný doplněk jen s tím, co mezitím přibylo.
name: Novinky z dat

on:
  schedule:
    # 12. den v měsíci v 6:00 UTC (8:00 v létě). ČSÚ do té doby zveřejní inflaci za minulý měsíc.
    - cron: '0 6 12 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  navrh:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v7

      - name: Stáhnout data a připravit novinky
        id: novinky
        env:
          NAVRH_POPIS: ${{ runner.temp }}/navrh.md
        run: python3 skripty/novinky.py

      - name: Poslat jako návrh ke schválení
        env:
          GH_TOKEN: ${{ github.token }}
          VYDANI: ${{ steps.novinky.outputs.vydani }}
        run: |
          if [ -z "$(git status --porcelain src/content/novinky)" ]; then
            echo "Od minulého vydání nejsou nová data."
            exit 0
          fi
          VETEV="novinky/$VYDANI"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$VETEV"
          git add src/content/novinky
          git commit -m "Novinky z dat: $VYDANI (návrh)"
          git push --force origin "$VETEV"
          # otevřený návrh pro stejné vydání jen aktualizuje, jinak založí nový
          OTEVRENY="$(gh pr list --head "$VETEV" --state open --json number --jq '.[].number' | head -n 1)"
          if [ -n "$OTEVRENY" ]; then
            gh pr edit "$OTEVRENY" --body-file "$RUNNER_TEMP/navrh.md"
          else
            gh pr create --base main --head "$VETEV" --title "Novinky z dat: $VYDANI" --body-file "$RUNNER_TEMP/navrh.md"
          fi
